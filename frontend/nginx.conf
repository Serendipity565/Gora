# Gora 前端 nginx 配置
#
# - 静态资源由 nginx 直接托管 dist/
# - /api 与 /health 反向代理到 docker compose 网络中的 backend 服务（端口 8080）
# - SSE 友好：关闭 buffering / 加大读超时，保证流式 chat 不会被缓冲

upstream gora_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root        /usr/share/nginx/html;
    index       index.html;

    # gzip 压缩（前端静态资源）
    gzip            on;
    gzip_types      text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback：未匹配的路径回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代 API
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # SSE / 长连接：禁用 buffer，加大超时
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_pass http://gora_backend;
    }

    # 健康检查直通后端
    location = /health {
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";
        proxy_pass http://gora_backend/health;
    }
}
